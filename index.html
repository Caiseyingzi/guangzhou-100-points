var info = new AMap.InfoWindow({offset: new AMap.Pixel(0,-14)});

function normName(s) {
  return (s || '').replace(/[（）()\s·\-—。.、,，]/g, '').replace(/店$/, '');
}
function isSimilar(a, b) {
  var x = normName(a), y = normName(b);
  if (!y || x === y) return true;
  if (x.indexOf(y) >= 0 || y.indexOf(x) >= 0) return true;
  var short = x.length < y.length ? x : y, long = x.length < y.length ? y : x;
  var hit = 0;
  for (var i = 0; i < short.length; i++) if (long.indexOf(short[i]) >= 0) hit++;
  return hit / short.length >= 0.8;
}

function openInfo(p, pos) {
  var img = p.photo ? '<img class="iw-photo" src="photos/' + p.photo + '" alt="">' : '';
  var note = p.note ? '<div class="iw-note">注：' + p.note + '</div>' : '';
  info.setContent(
    '<div class="iw-card">' + img +
    '<div class="iw-body">' +
      '<h4>' + p.name + '</h4>' +
      (isSimilar(p.name, p.poi_name) ? '' : '<div class="iw-poi">' + (p.poi_name||'') + '</div>') +
      '<div class="iw-addr">' + (p.address||'高德未提供门牌') + ' · ' + p.district + '</div>' +
      note +
    '</div></div>');
  info.open(map, pos);
}

function dotHTML(p){
  return '<div style="width:12px;height:12px;border-radius:50%;background:' + p.c + ';border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)"></div>';
}
function bubbleHTML(n){
  var size = n < 10 ? 28 : (n < 30 ? 34 : 40);
  return '<div style="width:' + size + 'px;height:' + size + 'px;border-radius:50%;background:rgba(27,58,87,.92);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35)">' + n + '</div>';
}


/* ================= 地铁图层 ================= */
var metroOn = true;
var metroLoaded = false;
var metroLineO = [], metroStaO = [], metroLblO = [];
var metroMeta = [];

function showList(arr, on){
  for (var i = 0; i < arr.length; i++) {
    if (on) { if (!arr[i]._onMap) { map.add(arr[i]); arr[i]._onMap = true; } }
    else { if (arr[i]._onMap) { map.remove(arr[i]); arr[i]._onMap = false; } }
  }
}

function syncMetro(){
  if (!metroLoaded) return;
  showList(metroLineO, metroOn);
  var z = map.getZoom();
  /* 低 zoom 线细而淡，避免中心区糊成一团；放大后加重，便于分辨线路 */
  var w = z < 10 ? 2.2 : (z < 12 ? 2.8 : (z < 14 ? 3.6 : 4.4));
  var op = z < 10 ? 0.58 : (z < 12 ? 0.70 : 0.85);
  for (var i = 0; i < metroLineO.length; i++) {
    metroLineO[i].setOptions({strokeWeight: w, strokeOpacity: op});
  }
  showList(metroStaO, metroOn && z >= 12.5);
  showList(metroLblO, metroOn && z >= 14);
}

function buildMetro(d){
  (d.lines || []).forEach(function(L){
    metroLineO.push(new AMap.Polyline({
      path: L.pts, strokeColor: L.color, strokeWeight: 3.2,
      strokeOpacity: 0.82, lineJoin: 'round', lineCap: 'round',
      zIndex: 20, bubble: false, showDir: false
    }));
    metroMeta.push(L);
  });
  (d.stations || []).forEach(function(S){
    metroStaO.push(new AMap.CircleMarker({
      center: S.pts, radius: 3.2, strokeColor: '#fff', strokeWeight: 1.4,
      fillColor: '#3b3b3b', fillOpacity: 0.9, zIndex: 22, bubble: false
    }));
    metroLblO.push(new AMap.Text({
      text: S.name, position: S.pts, zIndex: 23, bubble: false,
      style: {'background':'rgba(255,255,255,.88)','border':'none','padding':'1px 4px',
              'font-size':'10.5px','color':'#333','border-radius':'3px','white-space':'nowrap',
              'box-shadow':'0 1px 3px rgba(0,0,0,.18)','pointer-events':'none'}
    }));
  });
  metroLoaded = true;
  syncMetro();
}

if (METRO && METRO.lines && METRO.lines.length) {
  buildMetro(METRO);                     /* 内联数据，零网络请求 */
} else {
  fetch('data/metro.json').then(function(r){ return r.json(); })
    .then(buildMetro)
    .catch(function(e){ console.warn('地铁图层加载失败', e); });
}

document.getElementById('toggleMetro').addEventListener('click', function(){
  metroOn = !metroOn;
  this.textContent = metroOn ? '地铁 开' : '地铁 关';
  this.classList.toggle('on', metroOn);
  syncMetro();
});

function paint(){
  if (raf) { clearTimeout(raf); }
  raf = setTimeout(doPaint, 60);
}
function doPaint(){
  map.remove(drawn); drawn = [];
  if (!shownPts.length) return;
  var zoom = map.getZoom();
  if (zoom >= 15 || shownPts.length <= 3) {
    shownPts.filter(function(p){ return !p.noloc; }).forEach(function(p){ addDot(p, 1); });
    return;
  }
  var CELL = zoom < 10 ? 62 : (zoom < 12 ? 76 : 90);
  var cells = {}, order = [];
  shownPts.filter(function(p){ return !p.noloc; }).forEach(function(p){
    var px = map.lngLatToContainer(new AMap.LngLat(p.lng, p.lat));
    var k = Math.floor(px.getX()/CELL) + '|' + Math.floor(px.getY()/CELL);
    if (!cells[k]) { cells[k] = []; order.push(k); }
    cells[k].push(p);
  });
  order.forEach(function(k){
    var arr = cells[k];
    if (arr.length === 1) { addDot(arr[0], 1); }
    else {
      var lat = 0, lng = 0;
      arr.forEach(function(p){ lat += p.lat; lng += p.lng; });
      var m = new AMap.Marker({
        position: [lng/arr.length, lat/arr.length],
        content: bubbleHTML(arr.length),
        offset: new AMap.Pixel(-(arr.length<10?14:(arr.length<30?17:20)), -(arr.length<10?14:(arr.length<30?17:20))),
        zIndex: 200
      });
      m.on('click', function(){
        var lngs = arr.map(function(p){ return p.lng; }), lats = arr.map(function(p){ return p.lat; });
        var b = new AMap.Bounds([Math.min.apply(null,lngs), Math.min.apply(null,lats)], [Math.max.apply(null,lngs), Math.max.apply(null,lats)]);
        map.setBounds(b, false, [120,120,120,120]);
        setTimeout(function(){ map.setZoom(Math.min(map.getZoom() + 2, 16)); }, 260);
      });
      m.setMap(map); drawn.push(m);
    }
  });
}
function addDot(p, z){
  var m = new AMap.Marker({
    position: [p.lng, p.lat], content: dotHTML(p), offset: new AMap.Pixel(-7,-7),
    title: p.name, zIndex: z || 100
  });
  m.on('click', function(){
    Array.prototype.forEach.call(document.querySelectorAll('.item.on'), function(x){ x.classList.remove('on'); });
    var li = listEl.querySelector('.item[data-pid="' + p.pid + '"]');
    if (li) { li.classList.add('on'); li.scrollIntoView({block:'center', behavior:'smooth'}); }
    openInfo(p, [p.lng, p.lat]);
  });
  m.setMap(map); drawn.push(m);
}

function render() {
  map.remove(drawn); drawn = [];
  listEl.innerHTML = '';
  var on = {};
  Array.prototype.forEach.call(document.querySelectorAll('.ck input'), function(x){ if (x.checked) on[x.dataset.d] = 1; });
  shownPts = PTS.filter(function(p){ return on[p.district]; });
  var locPts = shownPts.filter(function(p){ return !p.noloc; });
  document.getElementById('n').textContent = shownPts.length;
  document.getElementById('empty').style.display = shownPts.length ? 'none' : 'block';
  var curD = null;
  shownPts.forEach(function(p){
    if (p.district !== curD) {
      curD = p.district;
      var g = document.createElement('div'); g.className = 'grp';
      var cnt = shownPts.filter(function(x){ return x.district === curD; }).length;
      g.textContent = curD + ' · ' + cnt;
      listEl.appendChild(g);
    }
    var el = document.createElement('div'); el.className = 'item'; el.dataset.pid = p.pid;
    var sub = (p.poi_name && p.poi_name !== p.name) ? (p.poi_name + ' · ') : '';
    if (p.noloc) sub = '';
    var thumb = p.photo ? '<img class="thumb" src="photos/' + p.photo + '" alt="" decoding="async">' : '<span class="thumb thumb-ph"></span>';
    el.innerHTML = '<span class="dot" style="background:' + p.c + '"></span>'
      + thumb
      + '<span style="flex:1;min-width:0"><span class="nm">' + p.name + '</span>'
      + '<span class="ad">' + sub + (p.address || '高德未提供门牌') + '</span></span>';
    el.onclick = function(){
      Array.prototype.forEach.call(document.querySelectorAll('.item.on'), function(x){ x.classList.remove('on'); });
      el.classList.add('on');
      map.setZoomAndCenter(16, [p.lng, p.lat]);
      openInfo(p, [p.lng, p.lat]);
      if (window.innerWidth <= 820) {
        var m = document.getElementById('map');
        var r = m.getBoundingClientRect();
        if (r.top < 0 || r.bottom < 120) m.scrollIntoView({block: 'start', behavior: 'smooth'});
      }
    };
    listEl.appendChild(el);
  });
  if (locPts.length) {
    var lngs = locPts.map(function(p){ return p.lng; }), lats = locPts.map(function(p){ return p.lat; });
    var b = new AMap.Bounds([Math.min.apply(null,lngs), Math.min.apply(null,lats)], [Math.max.apply(null,lngs), Math.max.apply(null,lats)]);
    map.setBounds(b, false, [70,70,70,70]);
  }
  doPaint();
}

function focusDistrict(d) {
  Array.prototype.forEach.call(document.querySelectorAll('.ck input'), function(x){ x.checked = (x.dataset.d === d); });
  render();
}

Array.prototype.forEach.call(document.querySelectorAll('.ck input'), function(x){ x.addEventListener('change', render); });
Array.prototype.forEach.call(document.querySelectorAll('.dl'), function(el){
  el.addEventListener('click', function(ev){ ev.preventDefault(); ev.stopPropagation(); focusDistrict(el.dataset.d); });
});
var _rz = null;
window.addEventListener('resize', function(){
  if (_rz) clearTimeout(_rz);
  _rz = setTimeout(function(){ map.resize(); paint(); }, 200);
});
document.getElementById('toggleAll').addEventListener('click', function(){
  var boxes = document.querySelectorAll('.ck input');
  var allOn = Array.prototype.every.call(boxes, function(x){ return x.checked; });
  Array.prototype.forEach.call(boxes, function(x){ x.checked = !allOn; });
  this.textContent = allOn ? '全选' : '清空';
  render();
});
Array.prototype.forEach.call(document.querySelectorAll('.ck input'), function(x){
  x.addEventListener('change', function(){
    var boxes = document.querySelectorAll('.ck input');
    var allOn = Array.prototype.every.call(boxes, function(b){ return b.checked; });
    document.getElementById('toggleAll').textContent = allOn ? '清空' : '全选';
  });
});
map.on('zoomend', function(){ paint(); syncMetro(); });
map.on('moveend', paint);
map.on('complete', render);
setTimeout(function(){ if (!drawn.length) render(); }, 1000);
</script>
</body></html>
